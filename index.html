<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draw Pinball</title>
  <meta name="description" content="Pinball ranking / draw tool. No ads.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23ff5d8f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <header class="top">
    <h1>Draw Pinball</h1>
    
  </header>

  <main class="layout">
    <section class="panel" id="panel">
      <div class="mini"><canvas id="mini" aria-label="Full map overview"></canvas></div>

      <h2>1. Enter names</h2>
      <textarea id="names" rows="6" spellcheck="false" placeholder="No1, No2, No3&#10;Name*3"></textarea>
      <div class="row">
        <span id="count" class="badge">0 balls</span>
        <button type="button" id="shuffle" class="ghost">Shuffle</button>
      </div>
      <p id="warn" class="warn" role="status"></p>

      <h2>2. Winner</h2>
      <div class="seg" role="radiogroup" aria-label="Winner mode">
        <label><input type="radio" name="mode" value="first" checked><span>First</span></label>
        <label><input type="radio" name="mode" value="last"><span>Last</span></label>
        <label><input type="radio" name="mode" value="multiple"><span>Multiple</span></label>
        <label><input type="radio" name="mode" value="group"><span>Group</span></label>
      </div>
      <div id="rangeWrap" hidden>
        <label class="field">Ranks
          <input id="ranges" type="text" value="1-3" placeholder="1-3, 7, 10~12" autocomplete="off">
        </label>
      </div>

      <div id="groupWrap" hidden>
        <label class="field">Groups
          <input id="groups" type="number" min="2" step="1" value="2" inputmode="numeric">
        </label>
      </div>

      <h2>3. Recording</h2>
      <label class="check"><input type="checkbox" id="record"><span>Record</span></label>
      <div id="recLink"></div>

      <h2>Options</h2>
      <div class="two">
        <label class="field">Speed
          <select id="speed">
            <option value="1">1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
            <option value="8">8×</option>
          </select>
        </label>
        <label class="field">Camera
          <select id="camera">
            <option value="auto">Follow</option>
            <option value="full">Full map</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button type="button" id="start" class="primary">Start</button>
        <button type="button" id="newmap" class="ghost">New map</button>
      </div>
    </section>

    <section class="stage">
      <canvas id="stage" width="720" height="1200" aria-label="Pinball stage"></canvas>
    </section>

    <aside class="panel board">
      <h2>Results</h2>
      <div id="winners" class="winners" aria-live="polite"></div>
      <ol id="order" class="order"></ol>
    </aside>
  </main>

  <script src="js/engine.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
